services:
  - type: web
    name: edubridge
    runtime: python
    plan: free # 512 MB RAM: the embedding model + chromadb may exceed it; switch to starter if it restarts
    buildCommand: bash build.sh
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Keep the embedding model inside the project dir so the runtime finds
      # what the build downloaded (src/vector_store.py loads local_files_only).
      - key: HF_HOME
        value: /opt/render/project/src/.hf_cache
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      # Direct download links for the two large College Scorecard CSVs,
      # used only at build time (https://collegescorecard.ed.gov/data/).
      - key: INSTITUTION_CSV_URL
        sync: false
      - key: FIELD_CSV_URL
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: edubridge/1.0
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: IGNAV_API_KEY
        sync: false
