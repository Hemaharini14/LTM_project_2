<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a new password — EduBridge</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 6 L46 16 L24 26 L2 16 Z"/>
        <path d="M12 20.5 V32 C12 35 17 38 24 38 C31 38 36 35 36 32 V20.5"/>
      </svg>
      <span class="brand-name">EduBridge</span>
    </a>
  </div>
</header>

<main class="wrap-narrow panel">
  <h1 class="page-title">Choose a new password</h1>
  <p class="page-sub">Pick something you have not used elsewhere.</p>

  <div class="card">
    <form id="reset-form">
      <div class="field">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
        <p class="hint">At least 8 characters.</p>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <input type="password" id="confirm-password" required minlength="8" autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Save new password</button>
    </form>

    <!-- Outside the form: a bad link hides the form, and the reason for
         hiding it has to stay on screen. -->
    <p class="error-text" id="reset-error" hidden></p>

    <div id="reset-done" hidden>
      <p class="hint">Your password has been changed, and anyone who was
        signed in to your account has been signed out.</p>
      <a class="btn btn-primary btn-block" href="login.html">Sign in</a>
    </div>
  </div>
</main>

<footer class="site-footer"><div class="wrap">EduBridge — AI-powered higher education discovery</div></footer>

<script src="js/common.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get("token");

const form = document.getElementById("reset-form");
const errorText = document.getElementById("reset-error");

function showError(message) {
  errorText.textContent = message;
  errorText.hidden = false;
}

// Without a token there is nothing to spend, so do not offer the form at all.
if (!token) {
  form.hidden = true;
  showError("This link is missing its reset code. Request a new link from the sign-in page.");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  errorText.hidden = true;

  const password = document.getElementById("new-password").value;

  if (password !== document.getElementById("confirm-password").value) {
    showError("Those two passwords do not match.");
    return;
  }

  const button = event.target.querySelector("button");
  setBusy(button, true, "Saving…");

  try {
    await api("/api/auth/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password })
    });
    form.hidden = true;
    document.getElementById("reset-done").hidden = false;
  } catch (error) {
    showError(error.message);
    setBusy(button, false);
  }
});
</script>
</body>
</html>
